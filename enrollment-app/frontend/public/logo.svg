<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Brazilian-flag inspired capoeira logo -->
  <defs>
    <clipPath id="roundedFrame">
      <rect x="0" y="0" width="500" height="500" rx="40" />
    </clipPath>
  </defs>

  <g clip-path="url(#roundedFrame)">
    <!-- Green background -->
    <rect x="0" y="0" width="500" height="500" fill="#0f9b3f" />

    <!-- Blue paint-stroke border accents -->
    <path d="M0,0 L120,0 L20,120 L0,90 Z" fill="#0a2f6b" />
    <path d="M500,0 L500,110 L380,0 Z" fill="#0a2f6b" />
    <path d="M0,500 L0,380 L120,500 Z" fill="#0a2f6b" />
    <path d="M500,500 L380,500 L500,390 Z" fill="#0a2f6b" />

    <!-- Yellow diamond -->
    <polygon points="250,50 460,250 250,450 40,250" fill="#ffd400" />

    <!-- Blue circle -->
    <circle cx="250" cy="250" r="120" fill="#0a2f6b" />

    <!-- Stars -->
    <g fill="#ffffff">
      <circle cx="180" cy="190" r="3" />
      <circle cx="310" cy="185" r="2.5" />
      <circle cx="330" cy="230" r="2" />
      <circle cx="160" cy="230" r="2" />
      <circle cx="200" cy="300" r="2.5" />
      <circle cx="300" cy="305" r="2" />
      <circle cx="250" cy="330" r="2" />
    </g>

    <!-- Banner -->
    <path d="M140,235 Q250,205 360,235 L360,255 Q250,225 140,255 Z" fill="#ffffff" />
    <text x="250" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f9b3f" letter-spacing="1">
      ORDEM E PROGRESSO
    </text>

    <!-- Capoeirista silhouette: high kick -->
    <g fill="#ffffff">
      <path d="M290,190
               C296,182 306,180 312,185
               C318,190 318,198 314,206
               L340,215
               C346,217 348,224 344,229
               C340,234 333,233 328,229
               L300,218
               L292,240
               C300,246 305,255 303,264
               L316,300
               C318,306 314,312 308,312
               C304,312 300,309 298,304
               L286,270
               L275,278
               L270,308
               C269,314 263,318 258,315
               C253,312 251,306 253,300
               L260,266
               L250,250
               C246,242 248,232 256,227
               L280,212
               C282,204 285,196 290,190 Z" />
    </g>

    <!-- Capoeirista silhouette: low ginga / floreio -->
    <g fill="#ffffff">
      <path d="M175,285
               C180,278 189,277 195,282
               L210,294
               C214,297 214,303 210,306
               C207,309 202,309 199,306
               L188,298
               L178,308
               C182,314 181,322 175,326
               L155,340
               C150,344 143,342 141,336
               C139,331 141,326 146,323
               L162,312
               L158,300
               C156,294 159,288 165,286
               Z" />
    </g>
  </g>

  <!-- Outer subtle border -->
  <rect x="2" y="2" width="496" height="496" rx="38" fill="none" stroke="#0a2f6b" stroke-width="4" />
</svg>
